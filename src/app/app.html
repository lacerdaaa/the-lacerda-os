<div class="stage">
  <div class="screen">
    <app-menu-bar />
    <app-desktop />

    @if (contextMenu.menu(); as menu) {
      <app-menu class="context-menu" [style.left.px]="menu.x" [style.top.px]="menu.y" [items]="menu.items" (done)="contextMenu.close()" />
    }

    @if (desktop.founderNoticeVisible()) {
      <app-alert-dialog
        [heading]="copy().founderTitle"
        [message]="copy().founderBody"
        [confirmLabel]="copy().ok"
        (confirmed)="desktop.dismissFounderNotice()"
      />
    }

    @if (desktop.booting()) {
      <app-boot-screen (done)="desktop.finishBoot()" />
    }
  </div>
</div>
