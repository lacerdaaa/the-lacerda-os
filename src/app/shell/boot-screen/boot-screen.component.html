@if (!showWelcome()) {
  <svg class="happy-mac" viewBox="0 0 32 40" shape-rendering="crispEdges" aria-hidden="true">
    <rect x="3.5" y="1.5" width="25" height="30" rx="2" fill="#e6e6e6" stroke="#000" />
    <rect x="7.5" y="5.5" width="17" height="14" fill="#fff" stroke="#000" />
    <rect x="12" y="9" width="1" height="3" fill="#000" />
    <rect x="19" y="9" width="1" height="3" fill="#000" />
    <rect x="15" y="10" width="2" height="1" fill="#000" />
    <rect x="16" y="11" width="1" height="3" fill="#000" />
    <rect x="15" y="13" width="1" height="1" fill="#000" />
    <rect x="12" y="15" width="1" height="1" fill="#000" />
    <rect x="13" y="16" width="6" height="1" fill="#000" />
    <rect x="19" y="15" width="1" height="1" fill="#000" />
    <rect x="8" y="24" width="5" height="1" fill="#000" />
    <rect x="18" y="24" width="7" height="2" fill="#9a9a9a" />
    <rect x="5.5" y="31.5" width="21" height="6" fill="#d0d0d0" stroke="#000" />
  </svg>
} @else {
  <section class="welcome">
    <div class="logo" aria-hidden="true"></div>
    <h1>{{ copy().welcome }}</h1>
    <p>{{ copy().starting }}</p>
    <div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" [attr.aria-valuenow]="percent()">
      <span [style.width.%]="progress() * 100"></span>
    </div>
  </section>

  <div class="parade" aria-hidden="true">
    @for (icon of parade(); track icon) {
      <app-icon [icon]="icon" [size]="32" />
    }
  </div>
}

<p class="skip">{{ copy().skip }}</p>
